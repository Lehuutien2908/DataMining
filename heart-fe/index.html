<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống Dự đoán Bệnh Tim - Bệnh viện Thái Bình</title>
  <link rel="stylesheet" href="static/style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <div class="heart-beat">Heart</div>
        <span>Hệ thống AI Dự đoán Bệnh Tim</span>
      </div>
      <h1>Bệnh viện Đa khoa tỉnh Thái Bình</h1>
    </header>

    <main class="main-content">
      <div class="card">
        <div class="model-selector">
          <label>Chọn mô hình dự đoán:</label>
          <select id="model">
            <option value="xgb">XGBoost - Độ chính xác cao nhất (99.6%)</option>
            <option value="svm">SVM - Rất ổn định trong y khoa (98.5%)</option>
            <option value="mlp">Neural Network (MLP)</option>
            <option value="rf">Random Forest (RF) - Tổng quát tốt</option>
          </select>
        </div>

        <div class="form-grid">
          <div class="input-group"><label>Tuổi</label><input type="number" id="age" placeholder="Ví dụ: 55" required></div>
          <div class="input-group"><label>Giới tính</label><select id="sex"><option value="">Chọn</option><option value="1">Nam</option><option value="0">Nữ</option></select></div>
          <div class="input-group"><label>Loại đau ngực</label><select id="cp"><option value="">Chọn loại</option><option value="0">Typical angina</option><option value="1">Atypical angina</option><option value="2">Non-anginal</option><option value="3">Không triệu chứng</option></select></div>
          <div class="input-group"><label>Huyết áp nghỉ (mmHg)</label><input type="number" id="trestbps" placeholder="Ví dụ: 140"></div>
          <div class="input-group"><label>Cholesterol (mg/dl)</label><input type="number" id="chol" placeholder="Ví dụ: 250"></div>
          <div class="input-group"><label>Đường huyết đói >120</label><select id="fbs"><option value="0">Không</option><option value="1">Có</option></select></div>
          <div class="input-group"><label>Kết quả ECG nghỉ</label><select id="restecg"><option value="0">Bình thường</option><option value="1">ST-T abnormal</option><option value="2">Hypertrophy</option></select></div>
          <div class="input-group"><label>Nhịp tim tối đa</label><input type="number" id="thalach" placeholder="Ví dụ: 150"></div>
          <div class="input-group"><label>Đau ngực khi tập</label><select id="exang"><option value="0">Không</option><option value="1">Có</option></select></div>
          <div class="input-group"><label>ST depression (oldpeak)</label><input type="number" step="0.1" id="oldpeak" placeholder="Ví dụ: 1.5"></div>
          <div class="input-group"><label>Slope ST segment</label><select id="slope"><option value="0">Upsloping</option><option value="1">Flat</option><option value="2">Downsloping</option></select></div>
          <div class="input-group"><label>Số mạch máu chính (ca)</label><input type="number" id="ca" min="0" max="4" placeholder="0-4"></div>
          <div class="input-group"><label>Thalassemia</label><select id="thal"><option value="1">Normal</option><option value="2">Fixed defect</option><option value="3">Reversible defect</option></select></div>
        </div>

        <button class="predict-btn" onclick="predict()">
          <span class="btn-text">DỰ ĐOÁN NGAY</span>
          <span class="loading" style="display:none">Đang phân tích dữ liệu...</span>
        </button>

        <div id="result" class="result-hidden"></div>
      </div>
    </main>

    <footer class="footer">
      <p>2025_datamining_2025 – Bệnh viện Đa khoa tỉnh Thái Bình</p>
    </footer>
  </div>

  <script src="static/app.js"></script>
</body>
</html>
