<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Dự đoán bệnh tim</title>
  <style>
    body { font-family: Arial; margin:20px; }
    .form-box { max-width:700px; margin:auto; border:1px solid #ccc; padding:20px; border-radius:8px; }
    label { display:block; margin-top:10px; }
    input { width:100%; padding:8px; margin-top:5px; }
    button { margin-top:15px; padding:10px 15px; background:#0077b6; color:white; border:none; border-radius:5px; cursor:pointer; }
    #result { margin-top:20px; font-weight:bold; }
    .back-btn { background:#555; margin-top:20px; }
  </style>
</head>
<body>
  <h1>🤖 Dự đoán bệnh tim</h1>
  <div class="form-box">
    <form id="patientForm">
      <label>Age: <input type="number" step="any" name="age" required></label>
      <label>Sex (0=female,1=male): <input type="number" step="any" name="sex" required></label>
      <label>Trestbps (resting blood pressure): <input type="number" step="any" name="trestbps" required></label>
      <label>Chol (cholesterol): <input type="number" step="any" name="chol" required></label>
      <label>Thalach (max heart rate): <input type="number" step="any" name="thalach" required></label>
      <label>Oldpeak (ST depression): <input type="number" step="any" name="oldpeak" required></label>
      <label>CP (chest pain type): <input type="number" step="any" name="cp" required></label>
      <label>FBS (fasting blood sugar): <input type="number" step="any" name="fbs" required></label>
      <label>Restecg (resting ECG): <input type="number" step="any" name="restecg" required></label>
      <label>Exang (exercise induced angina): <input type="number" step="any" name="exang" required></label>
      <label>Slope: <input type="number" step="any" name="slope" required></label>
      <label>Ca (number of major vessels): <input type="number" step="any" name="ca" required></label>
      <label>Thal: <input type="number" step="any" name="thal" required></label>

      <button type="button" onclick="predict('xgb')">Dự đoán bằng XGB</button>
      <button type="button" onclick="predict('mlp')">Dự đoán bằng MLP</button>
    </form>
    <div id="result"></div>

    <!-- Nút quay lại trang chủ -->
    <button class="back-btn" onclick="window.location.href='appc.html'">⬅ Quay lại Trang chủ</button>
  </div>

  <script>
    async function predict(model) {
      const form = document.getElementById("patientForm");
      const formData = new FormData(form);
      const data = {};
      formData.forEach((value, key) => { data[key] = parseFloat(value); });

      const response = await fetch(`http://localhost:8000/predict/${model}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await response.json();
      document.getElementById("result").innerText =
        `Xác suất: ${result.probability.toFixed(3)} | Kết quả: ${result.label === 1 ? "Có nguy cơ" : "Không có nguy cơ"}`;
    }
  </script>
</body>
</html>
